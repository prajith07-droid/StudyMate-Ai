<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;

        body {
            background-image: url('1234.jpg'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;

            padding: 0;
            min-height: 100vh;

            text-transform: capitalize;
            padding: 16px 40px;       
            border: none;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
